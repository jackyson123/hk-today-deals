name: Daily Update (即日資料)

on:
  schedule:
    - cron: '0 0 * * *'   # 08:00 HKT
    - cron: '0 4 * * *'   # 12:00 HKT
    - cron: '0 10 * * *'  # 18:00 HKT
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Update data
        run: npm run update-data

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/latest.json public/data/history.json
          git diff --staged --quiet || git commit -m "chore: update deals history $(date -u +%Y-%m-%d)"
          git push
